[project]
name = "mirofish-offline-backend"
version = "0.2.0"
description = "Backend for MiroFish Online synthetic audience graph"
requires-python = ">=3.11"
license = { text = "AGPL-3.0" }
authors = [
    { name = "MiroFish Team" }
]

dependencies = [
    # 核心框架
    "flask>=3.0.0",
    "flask-cors>=6.0.0",
    "gunicorn>=23.0.0",
    
    # LLM 相关
    "openai>=1.0.0",
    # HTTP client for the Ollama embedding API (app/storage/embedding_service.py)
    "requests>=2.28.0",
    
    # Neo4j graph database driver
    "neo4j>=5.15.0",
    
    # 文件处理
    "PyMuPDF>=1.24.0",
    # 编码检测（支持非UTF-8编码的文本文件）
    "charset-normalizer>=3.0.0",
    "chardet>=5.0.0",
    
    # 工具库
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
# The OASIS/CAMEL social simulation lane. Nothing under backend/app imports
# these: the only real imports live inside functions in
# backend/scripts/run_*_simulation.py, which SimulationRunner launches as
# subprocesses. Keeping them out of the default set is what removes torch and
# the 15 nvidia-*-cu12 wheels from the production image, which the Dockerfile
# builds with `uv sync --frozen --no-dev` and therefore without extras.
#
# To run simulations: uv sync --extra simulator
simulator = [
    "camel-oasis==0.2.5",
    "camel-ai==0.2.78",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pipreqs>=0.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
