name: Quality

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Compile backend Python
        working-directory: backend
        run: uv run python -m compileall app scripts run.py
      - name: Run backend tests
        working-directory: backend
        run: uv run pytest
      - name: Ruff changed Python files
        run: python3 scripts/ruff_changed.py

  cypher:
    # A live production run failed in 25 ms with a Cypher syntax error that no
    # other job could see: the rest of the suite uses the in-process store, which
    # never parses Cypher, and the history and graph queries were fine, so the UI
    # looked healthy while every live run was impossible. Neo4j validates syntax
    # on EXPLAIN without touching data, so this is cheap to keep permanently.
    name: Audience Cypher parses
    runs-on: ubuntu-latest
    services:
      neo4j:
        image: neo4j:5.18-community
        env:
          NEO4J_AUTH: neo4j/ci-cypher-check
          NEO4J_server_memory_heap_max__size: 512m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-cypher-check 'RETURN 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev
      - name: Explain every statement the audience store sends
        working-directory: backend
        env:
          MIROFISH_TEST_NEO4J_URI: bolt://localhost:7687
          MIROFISH_TEST_NEO4J_PASSWORD: ci-cypher-check
        run: uv run pytest tests/test_graph_store_cypher.py -v

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Build frontend
        run: npm run build --prefix frontend

  compose:
    name: Compose and smoke profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render RS2000 smoke compose
        run: docker compose --env-file deploy/rs2000/.env.example -f deploy/rs2000/docker-compose.cloud-smoke.yml config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate RS2000 private smoke profile
        run: python3 scripts/rs2000_smoke_check.py

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Scan tracked files for obvious secrets
        run: python3 scripts/check_secrets.py

  docker-build:
    name: Docker build sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image without pushing
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: mirofish-online:ci

  fallow-advisory:
    name: fallow-py advisory
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@v5
      - name: Run fallow-py diff advisory
        run: |
          python3 scripts/fallow_advisory.py || {
            echo "fallow-py advisory failed; keeping CI green because this is a baseline-only advisory gate."
            exit 0
          }
      - name: Upload fallow-py advisory artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fallow-py-advisory
          path: .quality/fallow-agent-fix-plan.json
          if-no-files-found: ignore
